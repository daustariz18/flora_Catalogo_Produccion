name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploying to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code from main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: catalog-react-v2/package-lock.json

      - name: Build catalog
        working-directory: catalog-react-v2
        run: |
          npm ci
          npm run build

      - name: Sync build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: catalog-react-v2/dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/vite-dev.err.log
