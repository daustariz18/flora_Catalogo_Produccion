name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploying to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Get latest code from main
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Como la cuenta FTP ya apunta directamente a la carpeta del catalogo, 
          # solo usamos una barra inclinada (/) para indicar la raíz de este usuario FTP.
          server-dir: /
          
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/vite-dev.err.log